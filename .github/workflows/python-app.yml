name: Deepfake Project CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Scripts
        run: python -m compileall -q .

      - name: Run Automated Tests
        run: python -m pytest -v

      - name: Generate Build Report
        if: always()
        run: |
          mkdir -p reports
          echo "# CI Build Report" > reports/build-report.md
          echo "Repository: $GITHUB_REPOSITORY" >> reports/build-report.md
          echo "Branch: $GITHUB_REF_NAME" >> reports/build-report.md
          echo "Commit: $GITHUB_SHA" >> reports/build-report.md
          echo "Status: ${{ job.status }}" >> reports/build-report.md

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-Build-Report
          path: reports/build-report.md
